[build-system]
requires = [
    "scikit-build-core",
    "pybind11"
]
build-backend = "scikit_build_core.build"


[project]
name = "mwframebuf"
version = "0.1.0"
description = "A small retro-style 8-bit framebuffer for Python powered by SDL3 and C++"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Maik Tappe" }
]
dependencies = [
    "numpy"
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: C++",
    "Operating System :: Microsoft :: Windows"
]


[tool.scikit-build]
cmake.build-type = "Release"
